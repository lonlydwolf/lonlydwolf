<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" role="img" aria-labelledby="title desc">
  <title id="title">Faculty: distinct roles, shared course records</title>
  <desc id="desc">Planning, practice, assessment and build review share saved course records. Research and exploration support the course. Roles are selected as needed; this is a role overview, not an automatic execution sequence.</desc>
  <style>
    .surface{fill:#f6f8fa}.ink{fill:#1f2328}.muted{fill:#59636e}.line{stroke:#8c959f}.accent{fill:#0969da}.record{fill:#ddf4ff;stroke:#54aeff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    @media(prefers-color-scheme:dark){.surface{fill:#161b22}.ink{fill:#f0f6fc}.muted{fill:#b1bac4}.line{stroke:#6e7681}.accent{fill:#79c0ff}.record{fill:#0c2d4a;stroke:#388bfd}}
  </style>
  <rect width="720" height="248" rx="12" class="surface"/>
  <g class="ink" font-size="22" font-weight="600" text-anchor="middle">
    <text x="104" y="50">Plan</text><text x="274" y="50">Practice</text><text x="446" y="50">Assess</text><text x="616" y="50">Review</text>
  </g>
  <g class="muted" font-size="16" text-anchor="middle">
    <text x="104" y="77">Advisor</text><text x="274" y="77">Teacher</text><text x="446" y="77">Tutor</text><text x="616" y="77">Editor</text>
  </g>
  <path d="M104 94v26H616V94M274 94v26M446 94v26M360 120v20" class="line" fill="none" stroke-width="2"/>
  <rect x="140" y="140" width="440" height="48" rx="6" class="record"/>
  <text x="360" y="171" class="ink" font-size="20" font-weight="600" text-anchor="middle">Shared course records</text>
  <text x="360" y="222" class="muted" font-size="16" text-anchor="middle">Setup, research and exploration support the course.</text>
</svg>
